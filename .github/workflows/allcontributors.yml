on:
  workflow_dispatch: # to be able to trigger this workflow by hand
  push:
    branches:
      - main
  schedule:
    - cron:  '0 12 * * 0' # weekly on Sunday at 12:00

name: Update allcontributors

permissions:
  contents: write
  pull-requests: write

jobs:

  allcontributors:

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    name: Update allcontributors

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          cache-version: 5
          extra-packages: any::allcontributors

      - name: Update allcontributors
        run: Rscript -e 'allcontributors::add_contributors(ncols = 5, num_sections = 1)'

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'Update allcontributors in README.md'
          author: 'Github Actions <github-actions@github.com>'
          committer: 'Github Actions <github-actions@github.com>'
          branch: update-allcontributors
          delete-branch: true
          title: 'Update allcontributors in README.md'
          body: 'Automated update of the contributors list in README.md.'
          add-paths: README.md
          token: ${{ secrets.ALLCONTRIBUTORS_PAT }}
