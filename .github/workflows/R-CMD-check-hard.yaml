# This is very similar to R-CMD-check but it doesn't install any dependencies in 
# 'Suggests'. The objective is to ensure that our package will not be threatened to
# be removed from CRAN if one of those 'Suggests' package is removed.
#
# In other words, all tests, vignettes, and examples must gracefully handle the 
# absence of one of those packages.

name: R-CMD-check-hard

on:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/R-CMD-check-hard.yaml
      - .Rbuildignore
      - data/**
      - man/**
      - R/**
      - inst/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE
  pull_request:
    paths:
      - .github/workflows/R-CMD-check-hard.yaml
      - .Rbuildignore
      - data/**
      - man/**
      - R/**
      - inst/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check-hard:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # 2.13.0
        with:
          pandoc-version: "latest"

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # 2.13.0
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # 2.13.0
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::curl
            any::testthat
            any::vdiffr
            any::knitr
            any::rmarkdown

      - uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399 # 2.13.0
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
