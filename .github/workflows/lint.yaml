# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/lint.yaml
      - .Rbuildignore
      - R/**
      - inst/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE
  pull_request:
    paths:
      - .github/workflows/lint.yaml
      - .Rbuildignore
      - R/**
      - inst/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: |
          lintr::lint_package(linters = lintr::linters_with_defaults(
            # Air takes care of all formatting so we deactivate all formatting-related rules
            brace_linter = NULL,
            commas_linter = NULL,
            function_left_parentheses_linter = NULL,
            indentation_linter = NULL,
            infix_spaces_linter = NULL,
            line_length_linter = NULL,
            paren_body_linter = NULL,
            pipe_continuation_linter = NULL,
            semicolon_linter = NULL,
            spaces_inside_linter = NULL,
            spaces_left_parentheses_linter = NULL,
            trailing_blank_lines_linter = NULL,
            trailing_whitespace_linter = NULL,
            whitespace_linter = NULL,

            # Handled by Jarl
            equals_na_linter = NULL,
            quotes_linter = NULL,
            T_and_F_symbol_linter = NULL
          ))
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: false
